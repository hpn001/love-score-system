<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>家庭积分系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f0ff;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{max-width:380px;width:90%;background:#fff;padding:22px 20px;border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.08)}
h2{margin:0 0 12px;color:#6b21a8}
input{width:100%;padding:9px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:14px}
button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:8px;background:#7c3aed;color:#fff;font-size:15px;cursor:pointer}
.tip{font-size:12px;color:#666;margin-top:6px}
</style>
</head>
<body>
<div class="box" id="ui"></div>
<script>
const sb=supabase.createClient(
 'https://qjzozechbtbohtcaulqz.supabase.co',
 'sb_publishable_yezkkG8fOBDuf7oAssvPg_KYvAq_Vs'
);
(async()=>{const{u:{user}}=await sb.auth.getUser();!user?showLogin():showHome(user)})();
function showLogin(){
 ui.innerHTML=`<h2>🔐 登录 / 注册</h2><input id="em" placeholder="邮箱"><input id="pw" type="password" placeholder="密码"><button onclick="doLogin()">登录</button><button onclick="doSignup()" style="background:#a78bfa">注册</button><div class="tip">用你自己的邮箱注册</div>`;
}
async function doLogin(){const r=await sb.auth.signInWithPassword({email:em.value,password:pw.value});if(r.error){alert(r.error.message);return}location.reload();}
async function doSignup(){const r=await sb.auth.signUp({email:em.value,password:pw.value});if(r.error){alert(r.error.message);return}alert('注册成功，现在可以登录了');location.reload();}
function showHome(u){ui.innerHTML=`<h2>🏠 家庭积分系统</h2><p>✅ 登录成功（${u.email}）</p><button onclick="sb.auth.signOut().then(()=>location.reload())">退出</button>`;}
</script>
</body>
</html>
