<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>家庭积分系统</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f0ff; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #6d28d9; }
        .member-card { background: #f3e8ff; padding: 15px; border-radius: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .score-btns button { background: #10b981; padding: 5px 10px; font-size: 12px; width: auto; margin-left: 5px; }
        .score-btns .minus-btn { background: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏠 家庭积分系统</h2>
    <p style="text-align:center; color:#666;">数据保存在本地，刷新不会丢失</p>
    
    <div id="members-list"></div>

    <h3>➕ 添加新成员</h3>
    <input type="text" id="new-member-name" placeholder="输入成员名字（如：爸爸）">
    <button onclick="addMember()">添加成员</button>
</div>

<script>
    // 页面加载时读取本地存储的数据
    document.addEventListener('DOMContentLoaded', loadMembers);

    function loadMembers() {
        const list = document.getElementById('members-list');
        const members = JSON.parse(localStorage.getItem('familyMembers')) || [
            { name: '爸爸', score: 0 },
            { name: '妈妈', score: 0 }
        ];
        list.innerHTML = '';
        members.forEach((member, index) => {
            const card = document.createElement('div');
            card.className = 'member-card';
            card.innerHTML = `
                <strong>${member.name}</strong>
                <span>分数: ${member.score}</span>
                <div class="score-btns">
                    <button onclick="changeScore(${index}, 1)">+1</button>
                    <button class="minus-btn" onclick="changeScore(${index}, -1)">-1</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function changeScore(index, change) {
        let members = JSON.parse(localStorage.getItem('familyMembers'));
        members[index].score += change;
        localStorage.setItem('familyMembers', JSON.stringify(members));
        loadMembers(); // 刷新显示
    }

    function addMember() {
        const nameInput = document.getElementById('new-member-name');
        const name = nameInput.value.trim();
        if (!name) { alert('请输入成员名字！'); return; }
        
        let members = JSON.parse(localStorage.getItem('familyMembers')) || [];
        members.push({ name: name, score: 0 });
        localStorage.setItem('familyMembers', JSON.stringify(members));
        nameInput.value = '';
        loadMembers();
    }
</script>

</body>
</html>
